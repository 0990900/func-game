<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FP Draft Game</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <div><h1>FP Draft</h1><p>함수형 프로그래밍 패턴을 모으는 드래프트 게임</p></div>
      <div id="connection" class="pill">연결 중</div>
    </header>

    <section id="entry" class="panel">
      <label>이름 <input id="name" maxlength="24" value="Player"></label>
      <div class="actions"><button id="create">방 만들기</button></div>
      <div class="join"><input id="roomCode" placeholder="room-..."><button id="join">방 참가</button></div>
    </section>

    <section id="room" class="hidden">
      <div class="statusbar"><strong id="roomId"></strong><span id="phase"></span></div>
      <section id="lobby" class="panel hidden"><h2>대기실</h2><div id="lobbyPlayers"></div><button id="start">게임 시작</button></section>
      <section id="goals" class="panel hidden"><h2>비밀 목표 선택</h2><p>둘 중 하나를 고르세요.</p><div id="goalCards" class="grid"></div></section>
      <section id="game" class="hidden">
        <div class="columns">
          <div>
            <section class="panel"><h2>내 손패</h2><p id="pickHelp"></p><div id="hand" class="grid cards"></div></section>
            <section class="panel"><h2>시장</h2><p>손패 카드를 먼저 선택한 뒤, 원하면 시장 카드와 교환할 수 있습니다.</p><div id="market" class="grid cards"></div></section>
            <section id="confirmPanel" class="panel hidden"><h2>선택 확인</h2><div id="confirmText"></div><div class="actions"><button id="submitPick">이대로 제출</button><button id="clearPick" class="secondary">다시 선택</button></div></section>
          </div>
          <div>
            <section class="panel"><h2>내 플레이 영역</h2><div id="myArea" class="chips"></div><div id="claims"></div></section>
            <section class="panel"><h2>다른 플레이어</h2><div id="others"></div></section>
          </div>
        </div>
        <section class="panel"><h2>이번 픽 공개</h2><div id="reveal" class="chips"></div></section>
      </section>
      <section id="finished" class="panel hidden"><h2>게임 종료</h2><div id="scores"></div></section>
    </section>
    <div id="toast" aria-live="polite"></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
